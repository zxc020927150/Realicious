<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <title>商城管理後台</title>
    <link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
		/>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .a1 {
        color: white;
        text-decoration: none;
      }
      .search-bar {
        /* background-color: #e9ecef; */
        border-top: 1px solid #dee2e6;
      }
.search-bar {
  /* 背景色跟隨三級背景變數 */
  background-color: var(--bs-tertiary-bg);
  /* 邊框顏色跟隨邊框變數 */
  border-top: 1px solid var(--bs-border-color);
}
      .navbar-nav a.nav-link.active {
        border-radius: 5px;
        background-color: #0d6efd;
        color: white;
        font-weight: 800;
      }
    </style>
    	<script>
			(function() {
				const savedTheme = localStorage.getItem("theme") || "light";
				document.documentElement.setAttribute("data-bs-theme", savedTheme);
			})();
		</script>
  </head>
  <body>
    <div class="container mt-4">
      <!-- 商品管理 Header -->
      <div class="card shadow-sm mb-4">
        <div class="container">
          <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="/">YumWay ლ(´ڡ`ლ)</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-list' ? 'active' : '' %>"
                      href="admin.html"
                      >商城管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-announcement' ? 'active' : '' %>"
                      href="tags.html"
                      >標籤管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-categories' ? 'active' : '' %>"
                      href="orders.html"
                      >訂單管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-report' ? 'active' : '' %>"
                      href="points.html"
                      >紅利管理</a
                    >
                  </li>
                </ul>
                <button
                  class="btn btn-primary myThemeBtn"
                  onclick="toggleTheme()"
                >
                  暗或亮
                </button>
              </div>
            </div>
          </nav>
        </div>

        <!-- 新增商品區 -->
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <input
                type="text"
                id="p_name"
                class="form-control"
                placeholder="商品名稱"
              />
            </div>
            <div class="col-md-2">
              <input
                type="number"
                id="p_price"
                class="form-control"
                placeholder="價格"
              />
            </div>
            <div class="col-md-2">
              <input
                type="number"
                id="p_discount"
                class="form-control"
                placeholder="折扣 (1.0=原價)"
                step="0.1"
                value="1.0"
              />
            </div>
            <div class="col-md-2">
              <select id="p_cat" class="form-select">
                <option value="1">電子雞服裝</option>
                <option value="2">電子票券</option>
                <option value="3">虛擬頭像框</option>
                <!-- <option value="4">主食</option> -->
              </select>
            </div>
            <div class="col-md-3">
              <input type="file" id="p_photos" class="form-control" multiple accept="image/jpeg,image/png,image/webp" />
            </div>
            <div class="col-md-3">
              <button
                class="btn btn-primary w-100"
                onclick="saveProduct(false)"
              >
                確認上架
              </button>
            </div>
          </div>
        </div>

        <!-- 搜尋與篩選區 -->
        <div class="card-body search-bar">
          <div class="row g-3 align-items-center">
            <div class="col-auto"><strong>快速搜尋：</strong></div>
            <div class="col-md-4">
              <input
                type="text"
                id="searchKeyword"
                class="form-control form-control-sm"
                placeholder="搜尋 商品ID或名稱..."
              />
            </div>
            <div class="col-md-2">
              <select
                id="filterCat"
                class="form-select form-select-sm"
                onchange="doSearch()"
              >
                <option value="">所有分類</option>
                <option value="1">電子雞服裝</option>
                <option value="2">電子票券</option>
                <option value="3">虛擬頭像框</option>
                <!-- <option value="4">主食</option> -->
              </select>
            </div>
            <div class="col-auto">
              <button class="btn btn-sm btn-dark" onclick="doSearch()">
                搜尋
              </button>
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick="resetSearch()"
              >
                重置
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 列表區塊 -->
      <div class="card shadow-sm">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="ps-3">ID</th>
              <th>圖片</th>
              <th>分類</th>
              <th>名稱</th>
              <th>價格 (折後)</th>
              <th>上架/下架</th>
              <th class="text-center">操作</th>
            </tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
        <div class="card-footer bg-white">
          <div
            id="pagination-controls"
            class="d-flex justify-content-center"
          ></div>
        </div>
      </div>
    </div>

    <!-- 編輯彈窗 (內容不變) -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5>編輯商品</h5>
            <button
              type="button"
              class="btn-close"
              onclick="closeModal()"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit_id" />
            <div class="mb-3">
              <label>名稱</label
              ><input type="text" id="edit_name" class="form-control" />
            </div>
            <div class="mb-3">
              <label>價格</label
              ><input type="number" id="edit_price" class="form-control" />
            </div>
            <div class="mb-3">
              <label>折扣 (0.1~1.0)</label
              ><input
                type="number"
                id="edit_discount"
                class="form-control"
                step="0.1"
              />
            </div>
            <div class="mb-3">
              <label>分類</label>
              <select id="edit_cat" class="form-select">
                <option value="1">電子雞服裝</option>
                <option value="2">電子票券</option>
                <option value="3">虛擬頭像框</option>
              </select>
            </div>
            <div class="mb-3">
              <label>新增圖片</label>
              <input type="file" id="edit_photos" class="form-control" multiple accept="image/jpeg,image/png,image/webp" />
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">
              取消</button
            ><button class="btn btn-success" onclick="saveProduct(true)">
              儲存變更
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let currentPage = 1;
      let editModal;

      window.onload = () => {
        editModal = new bootstrap.Modal(document.getElementById("editModal"));
        loadProducts();
      };

      // 更新：增加 keyword 與 category_id 參數
      async function loadProducts(page = 1) {
        currentPage = page;
        const keyword = document.getElementById("searchKeyword").value;
        const categoryId = document.getElementById("filterCat").value;

        // 將搜尋條件附加在 URL 之後
        const res = await fetch(
          `/products?page=${page}&keyword=${keyword}&category_id=${categoryId}`,
        );
        const result = await res.json();

        if (result.success) {
          document.getElementById("product-list").innerHTML = result.data
            .map((p) => {
              const discount = p.discount || 1.0;
              const finalPrice = Math.round(p.price * discount);
              const imgHtml = p.main_img
                ? `<img src="${p.main_img}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;">`
                : `<span class="text-muted">無</span>`;
              return `
                <tr>
                    <td class="ps-3">${p.id}</td>
                    <td>${imgHtml}</td>
                    <td><span class="badge bg-info text-dark">${p.category_name || "未分類"}</span></td>
                    <td><strong>${p.name}</strong></td>
                    <td>
                        <span class="text-muted text-decoration-line-through small">$${p.price}</span><br>
                        <span class="text-danger fw-bold">$${finalPrice}</span>
                        <small class="badge bg-warning text-dark">${discount < 1 ? (discount * 10).toFixed(1) + "折" : "原價"}</small>
                    </td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" ${p.is_active ? "checked" : ""} onclick="toggleStatus(${p.id})">
                        </div>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-success" onclick="openEdit(${p.id},'${p.name}',${p.price},${discount},${p.category_id})">編輯</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">刪除</button>
                    </td>
                </tr>
            `;
            })
            .join("");
          renderPagination(result.pagination.totalPages);
        }
      }

      // 搜尋功能執行
      function doSearch() {
        loadProducts(1); // 切換分類後，自動從第一頁開始顯示結果
      }

      // 重置搜尋
      function resetSearch() {
        document.getElementById("searchKeyword").value = "";
        document.getElementById("filterCat").value = "";
        loadProducts(1);
      }

      async function saveProduct(isEdit) {
        try {
          const id = isEdit ? document.getElementById("edit_id").value : null;
          let url, method;

          const fd = new FormData();
          fd.append("name", document.getElementById(isEdit ? "edit_name" : "p_name").value);
          fd.append("price", Number(document.getElementById(isEdit ? "edit_price" : "p_price").value));
          fd.append("discount", Number(document.getElementById(isEdit ? "edit_discount" : "p_discount").value) || 1.0);
          fd.append("category_id", document.getElementById(isEdit ? "edit_cat" : "p_cat").value);

          if (isEdit) {
            url = `/products/edit/${id}`;
            method = "PUT";
            const fileInput = document.getElementById("edit_photos");
            for (const f of fileInput.files) fd.append("photos", f);
          } else {
            url = `/products/add`;
            method = "POST";
            fd.append("stock_qty", 100);
            fd.append("restaurant_id", 1);
            fd.append("is_active", 1);
            const fileInput = document.getElementById("p_photos");
            for (const f of fileInput.files) fd.append("photos", f);
          }

          const res = await fetch(url, { method, body: fd });
          if (!res.ok) {
            const text = await res.text();
            alert("伺服器錯誤: " + text);
            return;
          }
          const result = await res.json();
          if (result.success) {
            if (isEdit) closeModal();
            else clearForm();
            loadProducts(currentPage);
          } else {
            alert("儲存失敗: " + (result.error || "不明錯誤"));
          }
        } catch (err) {
          alert("發生錯誤: " + err.message);
        }
      }

      function openEdit(id, name, price, discount, cat) {
        document.getElementById("edit_id").value = id;
        document.getElementById("edit_name").value = name;
        document.getElementById("edit_price").value = price;
        document.getElementById("edit_discount").value = discount;
        document.getElementById("edit_cat").value = cat;
        editModal.show();
      }

      function closeModal() {
        document.getElementById("edit_photos").value = "";
        editModal.hide();
      }
      function renderPagination(total) {
        let html = "";
        for (let i = 1; i <= total; i++) {
          html += `<button class="btn btn-sm mx-1 ${i === currentPage ? "btn-primary" : "btn-outline-primary"}" onclick="loadProducts(${i})">${i}</button>`;
        }
        document.getElementById("pagination-controls").innerHTML = html;
      }
      async function toggleStatus(id) {
        await fetch(`/products/toggle/${id}`, {
          method: "PATCH",
        });
        loadProducts(currentPage);
      }
      async function deleteProduct(id) {
        if (confirm("確定刪除商品？")) {
          await fetch(`/products/delete/${id}`, {
            method: "DELETE",
          });
          loadProducts(currentPage);
        }
      }

      function clearForm() {
        document.getElementById("p_name").value = "";
        document.getElementById("p_price").value = "";
        document.getElementById("p_discount").value = "1.0";
        document.getElementById("p_cat").value = "1";
      }

      function toggleTheme() {
        const html = document.querySelector("html");
        const theme = html.getAttribute("data-bs-theme");
        const newTheme = theme === "dark" ? "light" : "dark";

        html.setAttribute("data-bs-theme", newTheme);
        localStorage.setItem("theme", newTheme); // 保存到 localStorage
      }
    </script>
  </body>
</html>
