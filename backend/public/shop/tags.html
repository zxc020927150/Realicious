<!doctype html>
<html lang="zh-hant">
  <head>
    <meta charset="UTF-8" />
    <title>標籤管理系統</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .card-header {
        font-weight: bold;
        display: flex;
      }
      .a1 {
        color: white;
        text-decoration: none;
      }
      /* .badge-category {
        font-size: 0.8rem;
      } */
      .search-bar {
        background-color: #e9ecef;
        border-top: 1px solid #dee2e6;
      }
      .navbar-nav a.nav-link.active {
        border-radius: 5px;
        background-color: #0d6efd;
        color: white;
        font-weight: 800;
      }
    </style>
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", savedTheme);
      })();
    </script>
  </head>
  <body>
    <div class="container mt-4">
      <div class="card shadow-sm">
        <div class="container">
          <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="/">YumWay ლ(´ڡ`ლ)</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-list' ? 'active' : '' %>"
                      href="admin.html"
                      >商城管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-announcement' ? 'active' : '' %>"
                      href="tags.html"
                      >標籤管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-categories' ? 'active' : '' %>"
                      href="orders.html"
                      >訂單管理</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link <%= pageName === 'articles-report' ? 'active' : '' %>"
                      href="points.html"
                      >紅利管理</a
                    >
                  </li>
                </ul>
                <button
                  class="btn btn-primary myThemeBtn"
                  onclick="toggleTheme()"
                >
                  暗或亮
                </button>
              </div>
            </div>
          </nav>
        </div>
        <div class="card-body">
          <!-- 新增區塊：增加下拉選單 -->
          <div class="input-group mb-4">
            <input
              type="text"
              id="tagNameInput"
              class="form-control"
              placeholder="標籤名稱 (如: 台北市)"
            />
            <!-- <select
              id="tagCategoryInput"
              class="form-select"
              style="max-width: 150px"
            >
              <option value="location">地區</option>
              <option value="food_type">食物類型</option>
              <option value="feature">餐廳特色</option>
            </select> -->
            <button class="btn btn-primary" onclick="addTag()">新增標籤</button>
          </div>

          <!-- 列表顯示 -->
          <table class="table table-hover align-middle">
            <thead class="table-secondary">
              <tr>
                <th style="width: 80px">ID</th>
                <!-- <th style="width: 120px">分類</th> -->
                <th>標籤名稱 (name)</th>
                <th>建立時間</th>
                <th style="width: 150px">操作</th>
              </tr>
            </thead>
            <tbody id="tagTableBody"></tbody>
          </table>
          <div id="pagination-controls" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script>
      const apiBase = "/tags";
      let currentPage = 1;

      async function loadTags(page = 1) {
        currentPage = page;
        try {
          const res = await fetch(`${apiBase}?page=${page}`);
          const result = await res.json();
          const tbody = document.getElementById("tagTableBody");

          tbody.innerHTML = result.data
            .map(
              (tag) => `
                <tr>
                    <td>${tag.id}</td>
                    <td>
                        <input type="text" class="form-control form-control-sm" 
                            value="${tag.area}" id="input-${tag.id}">
                    </td>
                    <td><small class="text-muted">${new Date(tag.created_at).toLocaleString()}</small></td>
                    <td>
                        <button class="btn btn-success btn-sm" onclick="updateTag(${tag.id})">儲存</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTag(${tag.id})">刪除</button>
                    </td>
                </tr>
            `,
            )
            .join("");

          renderPagination(result.pagination.totalPages);
        } catch (error) {
          console.error("載入失敗:", error);
        }
      }

      function renderPagination(totalPages) {
        const container = document.getElementById("pagination-controls");
        let html = "";
        for (let i = 1; i <= totalPages; i++) {
          const activeClass =
            i === currentPage ? "btn-dark" : "btn-outline-dark";
          html += `<button class="btn ${activeClass} btn-sm me-1" onclick="loadTags(${i})">${i}</button>`;
        }
        container.innerHTML = html;
      }

      // 3. 新增：傳送 name 和 category
      async function addTag() {
        const area = document.getElementById("tagNameInput").value;
        // const category = document.getElementById("tagCategoryInput").value;
        if (!area) return alert("請輸入名稱");

        try {
          const res = await fetch(`${apiBase}/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ area }),
          });
          const result = await res.json();
          if (result.success) {
            document.getElementById("tagNameInput").value = "";
            loadTags(1);
          }
        } catch (error) {
          console.error("新增出錯:", error);
        }
      }

      // 4. 修改：維持 category 避免被 null 蓋掉
      async function updateTag(id) {
        const newName = document.getElementById(`input-${id}`).value;
        try {
          const res = await fetch(`${apiBase}/edit/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ area: newName }),
          });
          const result = await res.json();
          if (result.success) {
            alert("修改成功");
            loadTags(currentPage);
          }
        } catch (e) {
          alert("修改失敗");
        }
      }

    async function deleteTag(id) {
        if(!confirm('確定要刪除嗎？')) return;
        const res = await fetch(`${apiBase}/delete/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if(result.success) loadTags(currentPage);
    }

      loadTags();
    </script>
  </body>
</html>
